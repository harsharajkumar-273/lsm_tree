name: LSM-Tree CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '17 3 * * 1'     # weekly mutation check
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout codebase
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake liburing-dev pkg-config

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build project targets
      run: cmake --build build --config Release

    # ctest runs every test registered in CMakeLists.txt, so a new test is in CI
    # the moment it is added; the hand-maintained list this replaced had already
    # drifted (test_wal_ordering and test_skip_list_invariants were never run).
    - name: Run all registered tests
      run: ctest --test-dir build --output-on-failure --timeout 300

    # Smoke run only: proves the benchmark builds and runs. CI machines are too
    # noisy for performance numbers to gate on; real runs are recorded in
    # benchmarks/results.md with their hardware.
    - name: Benchmark smoke run
      run: ./build/bench_durability --quick --dir /tmp/lsm_ci_bench

  # Plants known bugs in the engine one at a time and requires the test suite to
  # fail for each. ~30 minutes, so weekly / on demand rather than per push.
  mutation-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake liburing-dev pkg-config python3
    - name: Run mutation check
      run: python3 tools/mutation_check.py build_mut
